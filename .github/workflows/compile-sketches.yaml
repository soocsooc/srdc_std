name: Compile Sketches

on:
  push:
    paths-ignore:
    - '**.md'
  pull_request:
    paths-ignore:
    - '**.md'
  workflow_dispatch:

env:
  # It's convenient to set variables for values used multiple times in the workflow
  SKETCHES_REPORTS_PATH: sketches-reports
  SKETCHES_REPORTS_ARTIFACT_NAME: sketches-reports

jobs:
  compile-sketches:
    runs-on: ubuntu-24.04
    steps:
      # ESP32 3.3.x のツールチェーンは大きく、ランナーのディスクが足りなくなるため、
      # ビルドで使わないツール(.NET・Android SDK・GHC・CodeQL)を消して空きを作る
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      # ESP32のプラットフォームとツールチェーン(~/.arduino15)をキャッシュし、
      # ダウンロード元(GitHub Releases)の障害でビルドが失敗しないようにする。
      # プラットフォームのバージョンを変えたら、キーの esp32-3.3.11 も合わせて変える
      - name: Cache Arduino platforms
        uses: actions/cache@v4
        with:
          path: ~/.arduino15
          key: arduino15-${{ runner.os }}-esp32-3.3.11
      - uses: arduino/compile-sketches@v1
        with:
          enable-deltas-report: true
          sketches-report-path: ${{ env.SKETCHES_REPORTS_PATH }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fqbn: esp32:esp32:esp32
          platforms: |  # ESP32公式のpackage indexを使用する
            - name: esp32:esp32
              source-url: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
              version: 3.3.11
          libraries: |  # 依存パッケージを指定
            - name: AsyncTCP
              source-url: https://github.com/ESP32Async/AsyncTCP.git
            - name: ESPAsyncWebServer
              source-url: https://github.com/ESP32Async/ESPAsyncWebServer.git
          sketch-paths: |
            - srdc_1_LED
            - srdc_2_SWITCH
            - srdc_3_Buzzer
            - srdc_4_Sensor
            - srdc_5_Straight
            - srdc_6_rotate
            - srdc_7_P_control
            - srdc_8_micromouse

      # This step is needed to pass the size data to the report job 
      - name: Upload sketches report to workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SKETCHES_REPORTS_ARTIFACT_NAME }}
          path: ${{ env.SKETCHES_REPORTS_PATH }}

  report:
    needs: compile-sketches  # Wait for the compile job to finish to get the data for the report
    if: github.event_name == 'pull_request' # Only run the job when the workflow is triggered by a pull request
    runs-on: ubuntu-24.04
    steps:
      # This step is needed to get the size data produced by the compile jobs
      - name: Download sketches reports artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SKETCHES_REPORTS_ARTIFACT_NAME }}
          path: ${{ env.SKETCHES_REPORTS_PATH }}
        continue-on-error: true

      - uses: arduino/report-size-deltas@v1
        with:
          sketches-reports-source: ${{ env.SKETCHES_REPORTS_PATH }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
